name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          node -e "const actual = require('./package.json').version; const expected = process.env.EXPECTED_VERSION.replace(/^v/, ''); if (actual !== expected) { throw new Error('Version mismatch: package=' + actual + ', tag=' + expected); }"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: npm run build:linux
            artifact: linux
          - name: Windows
            os: windows-latest
            command: npm run build:win
            artifact: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create_args=(--title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            create_args+=(--prerelease)
          fi
          notes_file=".github/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            create_args+=(--notes-file "$notes_file")
          else
            create_args+=(--generate-notes)
          fi
          gh release create --repo "${{ github.repository }}" "$GITHUB_REF_NAME" "${create_args[@]}" artifacts/* || \
            gh release upload --repo "${{ github.repository }}" "$GITHUB_REF_NAME" artifacts/* --clobber
